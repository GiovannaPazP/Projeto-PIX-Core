        meta:
          id: req_a4cc4df653f84f439f85008efaf4036d
          created: 1795405463649
          modified: 1795478726983
          isPrivate: false
          description: >-
            # Cadastro de Chaves Pix


            **Endpoint:** `POST /pix/keys`


            **Descrição:** Cadastra uma chave Pix vinculada ao usuário
            autenticado.


            **Autenticação:** Obrigatória — JWT enviado pelo header
            `Authorization: Bearer <token>`.


            ## Tipos de chave aceitos


            | Tipo | Descrição | Valor |

            |---|---|---|

            | `CPF` | CPF válido com 11 dígitos | Obrigatório |

            | `EMAIL` | Endereço de e-mail válido | Obrigatório |

            | `ALEATORIA` | UUID gerado pelo backend | Não necessário |


            O identificador do usuário é obtido pelo JWT.


            ## Testes e respostas esperadas


            | Cenário | Status HTTP | Resultado |

            |---|---|---|

            | Cadastro de CPF/email válido | `201 Created` | Chave cadastrada |

            | Cadastro de chave aleatória | `201 Created` | UUID gerado e
            cadastrado |

            | CPF inválido | `400 Bad Request` | CPF inválido |

            | E-mail inválido | `400 Bad Request` | E-mail inválido |

            | CPF/e-mail sem valor | `400 Bad Request` | Campo obrigatório |

            | Chave já cadastrada | `409 Conflict` | Chave Pix já cadastrada |

            | Requisição sem JWT | `401 Unauthorized` | Acesso não autorizado |

            | JWT inválido ou expirado | `401 Unauthorized` | Acesso não
            autorizado |



            ## Observações


            - O `CreatePixKeyDto` verifica os tipos permitidos e a
            obrigatoriedade dos campos.

            - O `PixService` valida o formato do CPF e do e-mail.

            - O `JwtAuthGuard` identifica o usuário autenticado.

            - Chaves aleatórias são geradas exclusivamente pelo backend.
          sortKey: -1795405958339
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "keyType": "EMAIL",
              "keyValue": "teste.pix@example.com"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: bearer
          disabled: false
          token: "{{ token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
