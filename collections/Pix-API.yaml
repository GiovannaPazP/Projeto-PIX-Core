          description: >-
            # Transferência


            **Endpoint:** `POST /pix/transfer`


            **Descrição:** Transferir via usuário autenticado.


            **Autenticação:** Obrigatória — JWT enviado pelo header
            `Authorization: Bearer <token>`.


            ## Tipos de chave do destinatário aceitas


            | Tipo | Descrição |

            |---|---|

            | `CPF` | CPF válido com 11 dígitos |

            | `EMAIL` | Endereço de e-mail válido |

            | `ALEATORIA` | UUID (v4) |


            O identificador do usuário é obtido pelo JWT.

            A chave de idempotência (```Idempotency-Key```) é gerada pelo
            frontend e mandada no Header.


            ## Valores Incorretos (não aceitos)


            ### valores negativos

            ```json

            {
              "pixKeyReceiver": "teste.pix@example.com",
              "amount": "-1.00"
            }

            ```


            ### valor == "0"

            ```json

            {
              "pixKeyReceiver": "teste.pix@example.com",
              "amount": "0.00"
            }

            ```


            ### valores numéricos

            ```json

            {
              "pixKeyReceiver": "teste.pix@example.com",
              "amount": 9999.99
            }

            ```


            ### valores não informados

            ```json

            {
              "pixKeyReceiver": "",
              "amount": ""
            }

            ```
          sortKey: -1795460503542.5
